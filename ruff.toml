# Ruff settings (from ~/.config/pre-commit/template/).
line-length = 100
target-version = "py312"

[lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # Pyflakes: unused names, undefined names, ...
  "I",    # import sorting
  "N",    # naming
  "UP",   # newer Python syntax
  "B",    # likely bugs (bugbear)
  "A",    # shadowing builtins
  "C4",   # comprehensions
  "SIM",  # simplifications
  "RET",  # return statements
  "PIE",  # misc. lints
  "PERF", # performance
  "PTH",  # pathlib over os.path
  "PL",   # Pylint
  "RUF",  # Ruff's own
]
ignore = [
  # Too many returns / branches / arguments / statements in one function. Scripts often
  # have long step-by-step functions (a main, a report printer) where splitting them up
  # only hides the order of the steps; keyword-only arguments (PLR0917) stay checked.
  "PLR0911",
  "PLR0912",
  "PLR0913",
  "PLR0915",
  # "Magic" numbers in comparisons: naming every port, exit code or version number as a
  # constant makes this kind of code harder to read, not easier.
  "PLR2004",
]

[lint.per-file-ignores]
# A test class has one public method per test (PLR0904: too many public methods), and
# tables of expected values read best one long line per case (E501: line too long).
"**/test_*.py" = ["PLR0904", "E501"]
