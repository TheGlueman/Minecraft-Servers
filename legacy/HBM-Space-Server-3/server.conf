NAME=hbm
JAVA_BIN=/usr/lib/jvm/java-8-openjdk/jre/bin/java
JAVA_VERSION_MATCH='version "1.8.'
JAR_FILE=forge-1.7.10-10.13.4.1614-1.7.10-universal.jar
RAM_ALLOCATION=8G
BACKUP_SOURCE=world
BACKUP_DIR=backups
# Mod sync (scripts/sync-mods.py): the client profile this server's mods come from.
PROFILE_DIR="$HOME/.var/app/com.modrinth.ModrinthApp/data/ModrinthApp/profiles/HBM Space 1.0.0"
# Mods to never copy (matched case-insensitively against mod ID and file name).
# Forge 1.7.10 mods don't mark themselves client-only, so this list does all the work.
SYNC_EXCLUDE=(angelica blur mousetweaks armoredarms soundfilters shaderfixer overloadedarmorbar NEIIntegration Controlling)
# Config files/folders (relative to config/, wildcards allowed) never overwritten from the profile.
# DistantHorizons.toml holds the server's own serverId; the rest are files the mods regenerate.
SYNC_CONFIG_SKIP=(DistantHorizons.toml 'hbmRecipes/_*' 'hbmConfig/_*' AppliedEnergistics2/recipes AppliedEnergistics2/CustomRecipes.cfg)
