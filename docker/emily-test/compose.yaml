# Docker test of the Emily server, running on a COPY of its world.
#
#   cd docker/emily-test
#   docker compose up -d                                # start; stays down after a crash
#   AUTO_RESTART=on-failure:3 docker compose up -d      # start; up to 3 restarts after crashes
#   docker compose logs -f mc                           # follow the server log
#   docker compose exec mc rcon-cli                     # server console (type commands)
#   ../../docker.sh emily-test backup                   # live backup now -> manual/
#   ../../docker.sh emily-test stop                     # warn players, stop, full backup -> shutdown/
#   ../../docker.sh emily-test restart                  # same as stop, then start again
#   docker compose down                                 # stop WITHOUT a backup
#
# Backups (in ../../Emily-Docker-Test/backups-docker/, .tar.gz):
#   auto/      live, every 24h the server has been up (none at start)
#   manual/    live, from "docker.sh ... backup" (a raw "exec backups backup now" lands in auto/)
#   shutdown/  full, from "docker.sh ... stop/restart", made while the server is off
# Live backups leave out Distant Horizons (its databases can't be paused); shutdown ones
# include it. A crash never triggers a backup. Each folder keeps its newest KEEP_BACKUPS (10),
# pruned only right after a good backup. Players see start/finish/failure messages in chat
# (docker/backup-hooks/).
#
# Data:     ../../Emily-Docker-Test/              (a copy; the real Emily-Server is untouched)
# Join:     localhost:25567 from this PC only.
# RCON:     password in ~/.config/minecraft-servers/emily-test-rcon.env (outside git);
#           also reachable from this PC only, on 127.0.0.1:25576.

name: emily-test

services:
  mc:
    # Pinned to the exact image that was tested; change the digest deliberately to update.
    image: itzg/minecraft-server:java25@sha256:7d4a888284c2f8d468f620f2534de648cb8eacba48df8d4d20b6ad1ef201f3a3
    restart: ${AUTO_RESTART:-no}
    env_file: ${HOME}/.config/minecraft-servers/emily-test-rcon.env
    environment:
      EULA: "TRUE"
      # Run the Fabric launcher jar already in the folder; the image installs nothing.
      TYPE: CUSTOM
      CUSTOM_SERVER: /data/fabric-server-mc.26.3-loader.0.19.5-launcher.1.1.2.jar
      VERSION: "26.3"
      # Matches server-port in server.properties; the health check pings this port.
      SERVER_PORT: "25566"
      MEMORY: 6G
      JVM_XX_OPTS: -XX:+UseZGC
      TZ: Europe/London
      # Seconds the server gets to save after "stop" before it is killed.
      STOP_DURATION: "90"
    stop_grace_period: 120s
    ports:
      # server.properties in the copy keeps server-port=25566.
      - "127.0.0.1:25567:25566"
      - "127.0.0.1:25576:25575"
    volumes:
      - ../../Emily-Docker-Test:/data
    stdin_open: true
    tty: true

  backups:
    image: itzg/mc-backup:latest@sha256:096796a6f001a2bb7dd36a764ef9030cca30b9b1783401082f79e9ae0267e9b9
    restart: ${AUTO_RESTART:-no}
    depends_on:
      - mc
    env_file: ${HOME}/.config/minecraft-servers/emily-test-rcon.env
    environment:
      RCON_HOST: mc
      SERVER_HOST: mc
      SERVER_PORT: "25566"
      BACKUP_NAME: emily-test
      DEST_DIR: /backups/auto
      BACKUP_INTERVAL: 24h
      # No backup at start: the first live backup comes after 24h of uptime.
      BACKUP_ON_STARTUP: "false"
      INITIAL_DELAY: 0s
      # The image's own pruning is off (it also prunes after failed backups);
      # backup-hook.sh keeps the newest KEEP_BACKUPS per folder after each good backup.
      PRUNE_BACKUPS_DAYS: "0"
      KEEP_BACKUPS: "10"
      # Chat announcements and pruning. The hooks must never fail the backup loop.
      PRE_SAVE_ALL_SCRIPT: /hooks/backup-hook.sh start || true
      POST_BACKUP_SCRIPT: /hooks/backup-hook.sh done "$$@" || true
      # Live backups leave out Distant Horizons: save-off can't pause its databases.
      EXCLUDES: "*.jar,cache,logs,*.tmp,backups,backups-docker,DistantHorizons.sqlite*"
      TZ: Europe/London
    volumes:
      - ../../Emily-Docker-Test:/data:ro
      - ../../Emily-Docker-Test/backups-docker:/backups
      - ../backup-hooks:/hooks:ro
