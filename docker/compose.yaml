# The one Compose file for every Docker server. Don't run it directly: use docker.sh
# (./docker.sh <name> up, down, backup, ...), which reads docker/servers/<name>/server.conf,
# passes its values in here, and runs this with docker/servers/<name>/ as the project
# folder, so the relative paths below (./data, ./backups) are that server's own.
#
# Per-server values (from server.conf, see docker/server.conf.example):
#   SERVER_NAME     the folder name under docker/servers/ (also the backup file prefix)
#   JAVA_IMAGE      itzg/minecraft-server image with the right Java, pinned by digest
#   MC_VERSION      Minecraft version, JAR_FILE: the server jar inside data/
#   RAM_ALLOCATION  heap size; JVM_OPTS: extra Java flags (JAVA_ARGS in server.conf)
#   SERVER_PORT     server-port from the server's own server.properties
#   GAME_PORT       the port players connect to, on BIND_ADDRESS (127.0.0.1 unless set)
#   RCON_PORT       the RCON port, always 127.0.0.1 only
#   ADMIN_NAME      who players are told to contact when a backup fails
#   DOCKER_DIR      this folder (set by docker.sh), for the shared backup hooks
#   HOST_UID, HOST_GID  your user and group ids (set by docker.sh)
# Everything else is shared by all servers.

# Settings both containers share, merged in below with "<<:". The restart policy: up to 3
# restarts after a crash; stopping a server yourself never triggers one.
x-common: &common
  restart: ${AUTO_RESTART:-on-failure:3}
  env_file: ${HOME}/.config/minecraft-servers/${SERVER_NAME:?}-rcon.env
x-environment: &environment
  TZ: Europe/London
  # The server's own port inside the network (the health check and backups ping it).
  SERVER_PORT: ${SERVER_PORT:?}

services:
  mc:
    <<: *common
    image: ${JAVA_IMAGE:?}
    environment:
      <<: *environment
      EULA: "TRUE"
      # Run the server jar already in the folder; the image installs nothing.
      TYPE: CUSTOM
      CUSTOM_SERVER: /data/${JAR_FILE:?}
      VERSION: ${MC_VERSION:?}
      MEMORY: ${RAM_ALLOCATION:?}
      JVM_OPTS: ${JVM_OPTS:-}
      # Run the server as you (docker.sh passes your ids), so its files in data/ are yours.
      UID: ${HOST_UID:?}
      GID: ${HOST_GID:?}
      # Seconds the server gets to save after "stop" before it is killed.
      STOP_DURATION: "90"
    stop_grace_period: 120s
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${GAME_PORT:?}:${SERVER_PORT:?}"
      - "127.0.0.1:${RCON_PORT:?}:25575"
    volumes:
      - ./data:/data
    stdin_open: true
    tty: true

  backups:
    <<: *common
    image: itzg/mc-backup:latest@sha256:096796a6f001a2bb7dd36a764ef9030cca30b9b1783401082f79e9ae0267e9b9
    depends_on:
      - mc
    environment:
      <<: *environment
      RCON_HOST: mc
      SERVER_HOST: mc
      BACKUP_NAME: ${SERVER_NAME:?}
      BACKUP_INTERVAL: 24h
      # No backup at start: the first live backup comes after 24h of uptime.
      BACKUP_ON_STARTUP: "false"
      INITIAL_DELAY: 0s
      # The image's own pruning is off (it also prunes after failed backups);
      # backup-hook.sh keeps the newest KEEP_BACKUPS of each kind after each good backup.
      PRUNE_BACKUPS_DAYS: "0"
      KEEP_BACKUPS: "10"
      # Chat announcements and pruning. The hooks must never fail the backup loop.
      PRE_SAVE_ALL_SCRIPT: /hooks/backup-hook.sh start || true
      POST_BACKUP_SCRIPT: /hooks/backup-hook.sh done "$$@" || true
      # Live backups leave out Distant Horizons: save-off can't pause its databases.
      # "backups" is only there in case a copied server brought its old backups/ folder.
      EXCLUDES: "*.jar,cache,logs,*.tmp,backups,DistantHorizons.sqlite*"
      # Named in the failed-backup message.
      ADMIN_NAME: ${ADMIN_NAME:?}
    volumes:
      - ./data:/data:ro
      # Only this container sees the backups; the server container can't touch them.
      - ./backups:/backups
      - ${DOCKER_DIR:?}/backup-hooks:/hooks:ro
