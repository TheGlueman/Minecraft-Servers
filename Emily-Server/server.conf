NAME=emily
JAVA_BIN=/usr/lib/jvm/java-25-openjdk/bin/java
JAVA_VERSION_MATCH='version "25.'
JAR_FILE=fabric-server-mc.26.3-loader.0.19.5-launcher.1.1.2.jar
RAM_ALLOCATION=6G
# ZGC: concurrent garbage collector recommended by Distant Horizons (Java 21+).
JAVA_ARGS=(-XX:+UseZGC)
BACKUP_SOURCE=world
BACKUP_DIR=backups
# Mod sync (scripts/sync-mods.py): the client profile this server's mods come from.
PROFILE_DIR="$HOME/.var/app/com.modrinth.ModrinthApp/data/ModrinthApp/profiles/Vanilla Basic 3 1.0.0"
# Mods to never copy (matched case-insensitively against mod ID and file name).
SYNC_EXCLUDE=(durabilitytooltip entityculling skinlayers3d waveycapes seedrenderer)
# Config files/folders (relative to config/, wildcards allowed) never overwritten from the profile.
# DistantHorizons.toml holds this server's own serverId.
SYNC_CONFIG_SKIP=(DistantHorizons.toml)
